name: research-ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Static validation
        run: |
          bash -n scripts/*.sh
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('.')
          for p in root.glob('configs/*.json'):
              json.loads(p.read_text())
          for p in root.glob('src/*/*.csproj'):
              ET.fromstring(p.read_text())
          print('static validation: PASS')
          PY

      - name: Restore
        run: dotnet restore AirlineRetryResearch.sln

      - name: Build
        run: dotnet build AirlineRetryResearch.sln --configuration Release --no-restore

      - name: Validate Compose
        run: docker compose config >/dev/null

      - name: Build containers
        run: docker compose build

      - name: Start research stack
        run: docker compose up -d

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/health >/dev/null && curl -fsS http://localhost:8081/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1

      - name: Normal smoke test
        run: bash scripts/smoke-test.sh

      - name: Ambiguous-timeout integration smoke
        run: bash scripts/ambiguity-smoke-test.sh

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown
        if: always()
        run: docker compose down -v
