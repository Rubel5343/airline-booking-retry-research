name: paper-grade-data-v1.1

on:
  workflow_dispatch:
    inputs:
      condition:
        description: "Frozen v1.1 condition to collect"
        required: true
        type: choice
        options:
          - A1
          - A2
          - A3
          - A4
          - B-V0
          - B-V1
          - B-V2
          - B-V4
          - D-F0
          - D-F5
          - D-F10
          - D-F20
          - C-R5
          - C-R20
          - C-R50
      confirmation:
        description: "Type RUN-PAPER-GRADE-V1.1"
        required: true
        type: string

concurrency:
  group: paper-grade-v11-${{ inputs.condition }}
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ inputs.confirmation == 'RUN-PAPER-GRADE-V1.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout frozen protocol ref
        uses: actions/checkout@v4
        with:
          ref: protocol-v1.1
          fetch-depth: 1

      - name: Record frozen commit
        id: freeze
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Frozen commit: $(git rev-parse HEAD)"
          grep -q 'Status: \*\*FROZEN\*\*' EXPERIMENT_PROTOCOL_V1_1.md

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build
        run: |
          dotnet restore AirlineRetryResearch.sln
          dotnet build AirlineRetryResearch.sln --configuration Release --no-restore

      - name: Build and start research stack
        run: |
          docker compose build
          docker compose up -d

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/health >/dev/null && curl -fsS http://localhost:8081/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1

      - name: Recheck safety gate
        run: bash scripts/retrieve-failure-safety-test.sh

      - name: Collect correctness condition
        if: ${{ !startsWith(inputs.condition, 'C-') }}
        env:
          CONDITION_ID: ${{ inputs.condition }}
          GIT_COMMIT: ${{ steps.freeze.outputs.sha }}
        run: python3 scripts/run_final_correctness_condition.py

      - name: Collect load condition
        if: ${{ startsWith(inputs.condition, 'C-') }}
        env:
          CONDITION_ID: ${{ inputs.condition }}
          GIT_COMMIT: ${{ steps.freeze.outputs.sha }}
        run: python3 scripts/run_final_load_condition.py

      - name: Write collection manifest
        if: always()
        shell: bash
        run: |
          mkdir -p results/final
          cat > "results/final/workflow-${{ github.run_id }}.json" <<EOF
          {
            "workflowRunId": "${{ github.run_id }}",
            "condition": "${{ inputs.condition }}",
            "protocol": "v1.1",
            "frozenRef": "protocol-v1.1",
            "frozenCommit": "${{ steps.freeze.outputs.sha }}",
            "repository": "${{ github.repository }}"
          }
          EOF

      - name: Upload paper-grade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-grade-v11-${{ inputs.condition }}-${{ github.run_id }}
          path: results/final/**/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown
        if: always()
        run: docker compose down -v
